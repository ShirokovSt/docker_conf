# Настройки Spark Connect server (контейнер spark).
# После правки: docker compose restart spark

# Локальный режим: драйвер и исполнители в одном процессе, все ядра. Hadoop-кластер не нужен.
spark.master                     local[*]
# Память драйвера (= вся память Spark в локальном режиме)
spark.driver.memory              2g

# Spark Connect: порт для клиентов (sc://localhost:15002)
spark.connect.grpc.binding.port  15002
# Spark UI: http://localhost:4040
spark.ui.port                    4040

# Куда --packages скачивает spark-connect (папка spark/ivy, кэш между запусками)
spark.jars.ivy                   /opt/spark/ivy
# Куда saveAsTable пишет файлы таблиц (папка spark/data/warehouse)
spark.sql.warehouse.dir          /data/warehouse

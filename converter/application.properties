# Настройки конвертера (контейнер converter, Spring Boot + JODConverter).
# Монтируется в /etc/app/application.properties. После правки: docker compose restart converter

# Максимальный размер загружаемого файла (по умолчанию в Spring Boot - 1 МБ)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Экземпляры LibreOffice: один порт = один процесс, конвертации идут параллельно
jodconverter.local.enabled=true
jodconverter.local.port-numbers=2002,2003
# Ожидание конвертации одного документа, мс (5 минут)
jodconverter.local.task-execution-timeout=300000

# Все локальные сервисы в одном файле: S3-хранилища + Kafka, Elasticsearch, ActiveMQ, PostgreSQL, Spark,
# мониторинг (Prometheus + Grafana, в том числе метрики TeamCity), конвертер документов, тестовая почта (Mailpit), Cassandra, логи контейнеров (Dozzle); TeamCity - через include.
# Пути к данным относительные (от этой папки), поэтому папку docker_conf можно класть куда угодно.
# Порты не пересекаются - можно запускать всё одновременно. Таблица портов - в README.md.
# Группы сервисов (для start-s3.bat / start-services.bat) - в _groups.bat.

name: devstack

# TeamCity (сервер, его БД, агенты) описан в своей папке - teamcity/docker-compose.yml.
include:
  - teamcity/docker-compose.yml

services:
  # MinIO: API 9000, UI 9001
  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - ./minio/data:/data
    restart: "no"

  # RustFS: API 9002, UI 9003
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    command:
      - --address
      - ":9002"
      - --console-address
      - ":9003"
      - --console-enable
      - --access-key
      - admin
      - --secret-key
      - admin123
      - /data
    ports:
      - "9002:9002"
      - "9003:9003"
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: admin123
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - ./rustfs/data:/data
    restart: "no"

  # Zenko CloudServer: API 9004 (UI - в S3 Manager)
  zenko:
    image: zenko/cloudserver
    container_name: zenko
    ports:
      - "9004:8000"
    environment:
      SCALITY_ACCESS_KEY_ID: admin
      SCALITY_SECRET_ACCESS_KEY: admin123
      S3DATAPATH: /data
      S3METADATAPATH: /metadata
      REMOTE_MANAGEMENT_DISABLE: "1"
      # Zenko принимает запросы только с Host из restEndpoints (по умолчанию localhost и т.п.).
      # "zenko" нужен для запросов из сети compose (S3 Manager). Несколько имён - через запятую.
      ENDPOINT: zenko
    volumes:
      - ./zenko_cloudserver/data:/data
      - ./zenko_cloudserver/metadata:/metadata
    restart: "no"

  # S3Proxy: API 9005 (без UI), бакеты = обычные папки в s3proxy/data
  s3proxy:
    image: andrewgaul/s3proxy
    container_name: s3proxy
    ports:
      - "9005:80"
    environment:
      S3PROXY_IDENTITY: admin
      S3PROXY_CREDENTIAL: admin123
    volumes:
      - ./s3proxy/data:/data
    restart: "no"

  # SeaweedFS: S3 API 8333, Filer UI 8888, Master UI 9333
  seaweedfs:
    image: chrislusf/seaweedfs
    container_name: seaweedfs
    command: server -s3
    ports:
      - "8333:8333"
      - "8888:8888"
      - "9333:9333"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin123
    volumes:
      - ./seaweedfs/data:/data
    restart: "no"

  # S3 Manager: общий веб-интерфейс для всех S3-хранилищ - http://localhost:9006
  # Страница хранилища: http://localhost:9006/<NAME>/buckets. Номера S3_N_ - подряд, без пропусков.
  # Хранилища подключены по внутренней сети compose (имя сервиса:внутренний порт).
  s3manager:
    image: cloudlena/s3manager:v0.11.1
    container_name: s3manager
    ports:
      - "9006:8080"
    environment:
      S3_1_NAME: minio
      S3_1_ENDPOINT: minio:9000
      S3_1_ACCESS_KEY_ID: admin
      S3_1_SECRET_ACCESS_KEY: admin123
      S3_1_REGION: us-east-1
      S3_1_USE_SSL: "false"
      S3_1_BUCKET_LOOKUP: Path
      S3_2_NAME: rustfs
      S3_2_ENDPOINT: rustfs:9002
      S3_2_ACCESS_KEY_ID: admin
      S3_2_SECRET_ACCESS_KEY: admin123
      S3_2_REGION: us-east-1
      S3_2_USE_SSL: "false"
      S3_2_BUCKET_LOOKUP: Path
      S3_3_NAME: zenko
      S3_3_ENDPOINT: zenko:8000
      S3_3_ACCESS_KEY_ID: admin
      S3_3_SECRET_ACCESS_KEY: admin123
      S3_3_REGION: us-east-1
      S3_3_USE_SSL: "false"
      S3_3_BUCKET_LOOKUP: Path
      S3_4_NAME: s3proxy
      S3_4_ENDPOINT: s3proxy:80
      S3_4_ACCESS_KEY_ID: admin
      S3_4_SECRET_ACCESS_KEY: admin123
      S3_4_REGION: us-east-1
      S3_4_USE_SSL: "false"
      S3_4_BUCKET_LOOKUP: Path
      S3_5_NAME: seaweedfs
      S3_5_ENDPOINT: seaweedfs:8333
      S3_5_ACCESS_KEY_ID: admin
      S3_5_SECRET_ACCESS_KEY: admin123
      S3_5_REGION: us-east-1
      S3_5_USE_SSL: "false"
      S3_5_BUCKET_LOOKUP: Path
    restart: "no"

  # ---------------------------------------------------------------------------
  # Сервисы
  # ---------------------------------------------------------------------------

  # Kafka (KRaft, без ZooKeeper): bootstrap для приложений на хосте - localhost:9092,
  # для других контейнеров - kafka:29092
  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # Фиксированный ID кластера (base64 UUID): нужен, чтобы данные в kafka/data подхватывались после пересоздания
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - ./kafka/data:/var/lib/kafka/data
    restart: "no"

  # Kafka UI: http://localhost:8080
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka
    restart: "no"

  # Elasticsearch 8 без пароля: API http://localhost:9200
  elasticsearch:
    image: elasticsearch:8.19.23
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - ./elasticsearch/data:/usr/share/elasticsearch/data
    restart: "no"

  # Kibana (UI для Elasticsearch): http://localhost:5601
  kibana:
    image: kibana:8.19.23
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: "no"

  # ActiveMQ Classic: консоль http://localhost:8161/admin (admin / admin123),
  # клиенты - tcp://localhost:61616 без логина
  activemq:
    image: apache/activemq-classic:5.18.7
    container_name: activemq
    ports:
      - "8161:8161"     # веб-консоль
      - "61616:61616"   # OpenWire (JMS)
      - "5672:5672"     # AMQP
      - "61613:61613"   # STOMP
      - "1883:1883"     # MQTT
      - "61614:61614"   # WebSocket
    # Пароль консоли задаётся файлом activemq/conf/jetty-realm.properties.
    # ACTIVEMQ_WEB_USER/PASSWORD в образе 5.18 правят users.properties, а консоль их не читает.
    volumes:
      - ./activemq/data:/opt/apache-activemq/data
      - ./activemq/conf/jetty-realm.properties:/opt/apache-activemq/conf/jetty-realm.properties:ro
    restart: "no"

  # PostgreSQL 16: localhost:5434 (postgres / admin123).
  # Внутри сети compose - postgres:5432.
  # Данные - в именованном томе postgres-data: bind mount с диска Windows не даёт initdb
  # выставить права 0700 на папку данных. Бэкапы - postgres\backup.bat в postgres/backup.
  postgres:
    image: postgres:16.15
    container_name: postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/backup:/backup
    restart: "no"

  # pgAdmin 4: http://localhost:5050 - без логина, серверы "devstack postgres" и "teamcity-db (TeamCity)" уже добавлены.
  # Без depends_on: запускается и один, например только для базы TeamCity (menu.bat, CI/CD) - выключенный
  # сервер просто не подключится.
  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: pgadmin
    # Пароли к серверам (postgres/pgadmin/pgpass) - заново при каждом старте, как и список серверов:
    # entrypoint образа копирует PGPASS_FILE только при первом создании тома pgadmin-data.
    entrypoint: ["/bin/sh", "-c", "cp /pgadmin4/pgpass /var/lib/pgadmin/.pgpass && chmod 600 /var/lib/pgadmin/.pgpass; exec /entrypoint.sh"]
    ports:
      - "5050:80"
    environment:
      # desktop-режим: вход без логина и мастер-пароля
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # образ требует их при первом запуске, в desktop-режиме не используются
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      # список серверов берётся из postgres/pgadmin/servers.json при каждом старте
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      # пароль к серверу: entrypoint копирует файл в /var/lib/pgadmin/.pgpass с правами 600
      PGPASS_FILE: /pgadmin4/pgpass
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./postgres/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./postgres/pgadmin/pgpass:/pgadmin4/pgpass:ro
    restart: "no"

  # Spark 3.5.2 - Spark Connect server: sc://localhost:15002, Spark UI http://localhost:4040
  # Без Hadoop-кластера (HDFS/YARN не нужны): local[*], драйвер и исполнители в одном контейнере.
  # Файлы - папка spark/data (в Spark - /data). Настройки - spark/conf/spark-defaults.conf.
  # Свои jar для classpath Spark - папка spark/jars (в Spark - /opt/spark/extra-jars).
  spark:
    image: spark:3.5.2-scala2.12-java17-ubuntu
    container_name: spark
    # Рабочая папка = spark/data: путь без папки (test.json) ищется в корне File Browser
    working_dir: /data
    command:
      - /opt/spark/sbin/start-connect-server.sh
      - --packages
      # в 3.5 Spark Connect не входит в дистрибутив; версия = версии образа
      - org.apache.spark:spark-connect_2.12:3.5.2
    environment:
      SPARK_NO_DAEMONIZE: "true"      # сервер в foreground, логи - в docker logs
      SPARK_LOG_DIR: /tmp/spark-logs  # служебные файлы spark-daemon.sh
    ports:
      - "15002:15002"   # Spark Connect
      - "4040:4040"     # Spark UI
    volumes:
      - ./spark/data:/data
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      # свои jar: подключаются в classpath через spark.driver.extraClassPath
      - ./spark/jars:/opt/spark/extra-jars:ro
      # кэш скачанного spark-connect: повторные старты без интернета
      - ./spark/ivy:/opt/spark/ivy
    restart: "no"

  # File Browser: веб-доступ к файлам Spark (папка spark/data) - http://localhost:8090, без логина
  # Работает под тем же пользователем, что и Spark (uid 185): иначе Spark не может читать
  # загруженные сюда файлы (Permission denied), а File Browser - удалять результаты Spark.
  # Поэтому запуск напрямую, без init.sh образа (он пишет в /config от uid 1000), порт 8080
  # (непривилегированный), настройки File Browser - во временной БД, при пересоздании без логина.
  spark-files:
    image: filebrowser/filebrowser:v2.63.23
    container_name: spark-files
    user: "185:185"
    entrypoint: ["/bin/filebrowser"]
    command: ["--noauth", "--address", "0.0.0.0", "--port", "8080", "--root", "/srv", "--database", "/tmp/filebrowser.db"]
    healthcheck:
      disable: true   # штатный healthcheck образа рассчитан на init.sh и порт 80
    ports:
      - "8090:8080"
    volumes:
      - ./spark/data:/srv
    restart: "no"

  # Prometheus: http://localhost:9090. Сам читает /actuator/prometheus у Spring-приложений
  # на этом компьютере (host.docker.internal). Какие приложения и порты читать -
  # monitoring/prometheus/targets.yml, перечитывается сам, перезапуск не нужен.
  # Данные - именованный том: Prometheus работает не от root, bind mount с Windows ему не подходит.
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/conf/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus/conf:ro
      - prometheus-data:/prometheus
    restart: "no"

  # Grafana: http://localhost:3000, без логина. Источник данных (Prometheus) и дашборд
  # Spring Boot подключены заранее (monitoring/grafana). Свои дашборды - в томе grafana-data.
  grafana:
    image: grafana/grafana:12.4.12
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/spring-boot.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: "no"

  # Конвертер документов (LibreOffice + JODConverter REST): API LibreOffice Online.
  # Для приложений: POST http://localhost:8095/lool/convert-to (поля data и format).
  # Swagger UI: http://localhost:8095/swagger-ui.html. Ничего не хранит - данных и томов нет.
  converter:
    image: ghcr.io/jodconverter/jodconverter-examples:rest-4.4.11-1
    container_name: converter
    ports:
      - "8095:8080"
    volumes:
      - ./converter/application.properties:/etc/app/application.properties:ro
    restart: "no"

  # Mailpit: тестовая почта. Приложения шлют письма на SMTP localhost:1025 (из контейнеров - mailpit:1025),
  # письма никуда не уходят и видны в веб-интерфейсе http://localhost:8025 (без логина).
  mailpit:
    image: axllent/mailpit:v1.31.5
    container_name: mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # веб-интерфейс и API
    environment:
      MP_DATABASE: /data/mailpit.db     # письма сохраняются между перезапусками
      # Лимиты хранения: старые письма удаляются сами. Поменять - правка здесь и mailpit\start.bat
      # (не "Перезапустить": только up пересоздаёт контейнер с новыми значениями)
      MP_MAX_MESSAGES: "1000"           # не больше 1000 писем
      MP_MAX_AGE: 7d                    # и не старше 7 дней (формат: 36h или 14d)
      MP_SMTP_AUTH_ACCEPT_ANY: "1"      # любой логин/пароль SMTP принимается
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"  # ...и без TLS
    volumes:
      - ./mailpit/data:/data
    restart: "no"

  # Cassandra 5: CQL localhost:9042 (из контейнеров - cassandra:9042), датацентр datacenter1, без логина.
  # Заранее ничего не создаётся: keyspace'ы и таблицы - в веб-интерфейсе (cassandra-ui) или через cqlsh.
  # Данные - в именованном томе: Cassandra работает не от root, bind mount с Windows ей не подходит.
  cassandra:
    image: cassandra:5.0.9
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      MAX_HEAP_SIZE: 1G       # без ограничения Cassandra берёт четверть памяти ПК
      HEAP_NEWSIZE: 256M
      CASSANDRA_CLUSTER_NAME: devstack
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 10
    restart: "no"

  # Веб-интерфейс Cassandra (свой, cassandra/ui): keyspace'ы, таблицы, файлы в blob, CQL-консоль -
  # http://localhost:8097, без логина. Образ собирается при каждом up (pull_policy: build): без изменений -
  # из кэша за секунды, после правок в cassandra/ui контейнер пересоздаётся с новым кодом.
  cassandra-ui:
    build: ./cassandra/ui
    image: devstack/cassandra-ui:1
    pull_policy: build
    container_name: cassandra-ui
    ports:
      - "8097:8080"
    environment:
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_DC: datacenter1
    depends_on:
      cassandra:
        condition: service_healthy
    restart: "no"

  # Dozzle - логи всех контейнеров в браузере (поиск, несколько рядом), запуск/остановка/перезапуск - http://localhost:8098.
  # Docker socket даёт ему управление Docker, поэтому порт открыт только для этого ПК (127.0.0.1). Консоль (shell) выключена.
  # Мастер первого запуска, аналитика и проверки обновлений выключены; ./dozzle/data - только dozzle.yml, если менять настройки в UI.
  dozzle:
    image: amir20/dozzle:v11.3.5
    container_name: dozzle
    ports:
      - "127.0.0.1:8098:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dozzle/data:/data
    environment:
      DOZZLE_HOSTNAME: devstack
      DOZZLE_ENABLE_ACTIONS: "true"
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_DISABLE_SETUP_WIZARD: "true"
      DOZZLE_RELEASE_CHECK_MODE: manual
      DOZZLE_IMAGE_CHECK_MODE: "off"
    restart: "no"

# Сеть проекта devstack_default создаётся не compose, а _net.bat при первом запуске из bat-файлов: он подбирает
# подсеть, свободную на этом ПК. Сам Docker берёт подсети из 172.17-172.31, а там же бывают сети, к которым
# подключён ПК (VPN и т.п.): при пересечении контейнеры до них не достают. Compose подключается к готовой сети
# и её подсеть не меняет. Если сети нет (запуск docker compose up вручную до первого запуска bat) - start-all.bat.
networks:
  default:
    name: devstack_default
    external: true

# Именованные тома Docker (живут внутри Docker Desktop, а не в папке проекта).
# Удаляются только явно: docker compose down -v или docker volume rm.
volumes:
  postgres-data:
  pgadmin-data:
  prometheus-data:
  grafana-data:
  cassandra-data:

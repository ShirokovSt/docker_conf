# TeamCity 2026.1.1: сервер, его БД, 3 агента, графики агентов (Beszel) и просмотр БД (Adminer).
# Подключается к проекту devstack через include в корневом docker-compose.yml: контейнеры - в общей группе
# devstack, запуск - вместе со всем (start-all.bat) или отдельно (teamcity\start.bat). Пути - от папки teamcity.
# Настройки (папка локальных исходников, тег образа агентов, доп. агенты) - в docker_conf\.env,
# Подробно - README.md.

# Общие настройки агентов (teamcity-agent-1..3 ниже)
x-teamcity-agent: &teamcity-agent
  # Свой образ: официальный агент + JDK 8/11/17/21 и Maven (agent/Dockerfile).
  # Не пересобирается: новый образ = новый тег (build-image.bat), тег - в .env.
  # Если образа с этим тегом ещё нет, compose один раз соберёт его из agent/.
  image: ${TEAMCITY_AGENT_IMAGE:-devstack/teamcity-agent:2026.1.1-3}
  build: ./agent
  pull_policy: missing
  # группа root (0) - доступ к сокету Docker Desktop без запуска агента от root
  group_add:
    - "0"
  depends_on:
    - teamcity
  restart: "no"

x-teamcity-agent-env: &teamcity-agent-env
  SERVER_URL: http://teamcity:8111
  # Testcontainers в сборках: контейнеры тестов - соседи агента в Docker Desktop, их порты - на host.docker.internal
  TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
  # часовой пояс этого ПК (HOST_TZ определяет teamcity\_tz.bat при запуске из bat-файлов; иначе - HOST_TZ из .env или UTC)
  TZ: ${HOST_TZ:-UTC}

services:
  # PostgreSQL только для TeamCity. База teamcity, пользователь teamcity / admin123 - создаёт сам образ
  # при первом запуске. Наружу не открыт: сервер подключается к teamcity-db:5432.
  teamcity-db:
    image: postgres:16.15
    container_name: teamcity-db
    environment:
      POSTGRES_DB: teamcity
      POSTGRES_USER: teamcity
      POSTGRES_PASSWORD: admin123
    volumes:
      - teamcity-db-data:/var/lib/postgresql/data
    restart: "no"

  # TeamCity server: http://localhost:8111. Data directory - именованный том teamcity-data.
  # /host - все диски этого ПК, только чтение: D:\work\app = /host/d/work/app. Так сборки берут код
  # из любой папки компьютера (локальная папка или file:///host/... для локального git-репозитория).
  # /run/desktop/mnt/host - место, где Docker Desktop (WSL2) держит диски Windows; другое - TEAMCITY_HOST_DRIVES в .env.
  teamcity:
    image: jetbrains/teamcity-server:2026.1.1
    container_name: teamcity
    # Перед стандартным запуском образа (/run-services.sh):
    # 1. Драйвер PostgreSQL: кнопка мастера качает его с download.jetbrains.com, а тот из РФ отвечает 451.
    #    Поэтому драйвер берётся с Maven Central - только если его ещё нет в <data dir>/lib/jdbc
    #    (штатное место по документации TeamCity).
    # 2. Администратор: в фоне ждём, пока сервер запустится (после первого старта - пока в мастере примут
    #    лицензию), и, если пользователей ещё нет, создаём TEAMCITY_ADMIN_USER / TEAMCITY_ADMIN_PASSWORD через
    #    REST API с токеном суперпользователя, который сервер пишет в лог при каждом запуске.
    entrypoint:
      - bash
      - -c
      - |
        jdbc=/data/teamcity_server/datadir/lib/jdbc
        jar=postgresql-42.7.14.jar
        if ! ls $$jdbc/postgresql-*.jar >/dev/null 2>&1; then
          mkdir -p $$jdbc
          curl -fsSL -o $$jdbc/$$jar.tmp https://repo.maven.apache.org/maven2/org/postgresql/postgresql/42.7.14/$$jar \
            && mv $$jdbc/$$jar.tmp $$jdbc/$$jar && echo "JDBC driver: $$jar downloaded" \
            || { rm -f $$jdbc/$$jar.tmp; echo "WARNING: JDBC driver download failed, see teamcity/README.md"; }
        fi
        (
          tc=http://localhost:8111; c=/tmp/tc-cookies
          until token=$$(grep -ao 'Super user authentication token: [0-9]*' /opt/teamcity/logs/teamcity-server.log 2>/dev/null | tail -1 | grep -o '[0-9]*$$') \
                && [ -n "$$token" ] && curl -sf -o /dev/null -u ":$$token" $$tc/app/rest/server; do sleep 10; done
          if curl -s -u ":$$token" -H 'Accept: application/json' "$$tc/app/rest/users?fields=count" | grep -q '"count":0'; then
            csrf=$$(curl -s -u ":$$token" -c $$c -b $$c "$$tc/authenticationTest.html?csrf")
            code=$$(curl -s -o /dev/null -w '%{http_code}' -u ":$$token" -c $$c -b $$c -H "X-TC-CSRF-Token: $$csrf" \
              -H 'Content-Type: application/json' "$$tc/app/rest/users" \
              -d "{\"username\":\"$$TEAMCITY_ADMIN_USER\",\"password\":\"$$TEAMCITY_ADMIN_PASSWORD\",\"roles\":{\"role\":[{\"roleId\":\"SYSTEM_ADMIN\",\"scope\":\"g\"}]}}")
            echo "TeamCity admin $$TEAMCITY_ADMIN_USER: HTTP $$code"
          fi
        ) &
        exec /run-services.sh
    ports:
      - "8111:8111"
    environment:
      TEAMCITY_SERVER_MEM_OPTS: -Xmx2g
      # разрешает VCS root file:///host/... (по умолчанию TeamCity запрещает локальные репозитории)
      TEAMCITY_SERVER_OPTS: -Dteamcity.git.allowFileUrl=true
      # администратор, создаётся при запуске, если пользователей ещё нет (см. entrypoint)
      TEAMCITY_ADMIN_USER: admin
      TEAMCITY_ADMIN_PASSWORD: admin123
    volumes:
      - teamcity-data:/data/teamcity_server/datadir
      - ./logs:/opt/teamcity/logs
      - ${TEAMCITY_HOST_DRIVES:-/run/desktop/mnt/host}:/host:ro
    depends_on:
      - teamcity-db
    restart: "no"

  # Агенты: имена Agent (devstack)-N. Конфиг (авторизация), рабочая папка и кеши
  # Gradle/Maven - в томах, переживают пересоздание контейнера.
  # По умолчанию запускается только teamcity-agent-1. Агенты 2 и 3 добавляются из menu.bat (пункт 10
  # "Агенты CI/CD") или docker compose up -d teamcity-agent-2. Профили agent-2 / agent-3 - только чтобы
  # docker compose up без имён не создавал их сам; добавленных агентов start-all / stop-all поднимают и
  # останавливают по созданным контейнерам (_groups.bat).
  # Бесплатная лицензия - до 3 агентов; 4-й и дальше - копия блока с новым номером и ключ лицензии.
  teamcity-agent-1:
    <<: *teamcity-agent
    container_name: teamcity-agent-1
    environment:
      <<: *teamcity-agent-env
      AGENT_NAME: Agent (devstack)-1
    volumes:
      - teamcity-agent-1-conf:/data/teamcity_agent/conf
      - teamcity-agent-1-work:/opt/buildagent/work
      - teamcity-agent-1-home:/home/buildagent
      - /var/run/docker.sock:/var/run/docker.sock
      - ${TEAMCITY_HOST_DRIVES:-/run/desktop/mnt/host}:/host:ro

  teamcity-agent-2:
    <<: *teamcity-agent
    profiles: ["agent-2"]
    container_name: teamcity-agent-2
    environment:
      <<: *teamcity-agent-env
      AGENT_NAME: Agent (devstack)-2
    volumes:
      - teamcity-agent-2-conf:/data/teamcity_agent/conf
      - teamcity-agent-2-work:/opt/buildagent/work
      - teamcity-agent-2-home:/home/buildagent
      - /var/run/docker.sock:/var/run/docker.sock
      - ${TEAMCITY_HOST_DRIVES:-/run/desktop/mnt/host}:/host:ro

  teamcity-agent-3:
    <<: *teamcity-agent
    profiles: ["agent-3"]
    container_name: teamcity-agent-3
    environment:
      <<: *teamcity-agent-env
      AGENT_NAME: Agent (devstack)-3
    volumes:
      - teamcity-agent-3-conf:/data/teamcity_agent/conf
      - teamcity-agent-3-work:/opt/buildagent/work
      - teamcity-agent-3-home:/home/buildagent
      - /var/run/docker.sock:/var/run/docker.sock
      - ${TEAMCITY_HOST_DRIVES:-/run/desktop/mnt/host}:/host:ro

  # Графики работы агентов: http://localhost:8091 (Beszel, admin@example.com / admin123).
  # CPU, память, сеть и диск каждого контейнера (в том числе teamcity-agent-N) с историей; сам почти не
  # нагружает ПК: hub и агент вместе - около 25 МБ (лимиты ниже). Hub сам создаёт ключ и показывает его только
  # в интерфейсе, а агент без ключа не стартует: поэтому после запуска контейнеров bat-файлы (teamcity\start.bat,
  # start-all.bat, menu.bat) вызывают _beszel-setup.bat - он один раз передаёт агенту ключ и добавляет систему
  # в hub; повторный запуск ничего не меняет.
  beszel:
    image: henrygd/beszel:0.21.1
    container_name: beszel
    ports:
      - "8091:8090"
    environment:
      # первый пользователь создаётся при первом запуске
      USER_EMAIL: admin@example.com
      USER_PASSWORD: admin123
    volumes:
      - beszel-data:/beszel_data
    mem_limit: 128m
    restart: "no"

  beszel-agent:
    image: henrygd/beszel-agent:0.21.1
    container_name: beszel-agent
    environment:
      # открытый ключ hub: файл кладёт _beszel-setup.bat (hub сам его не пишет); пока файла нет, агент не стартует
      KEY_FILE: /beszel_data/id_ed25519.pub
      LISTEN: "45876"
    volumes:
      - beszel-data:/beszel_data:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    depends_on:
      - beszel
    restart: "no"

  # Просмотр базы TeamCity: http://localhost:8082 (Adminer, один PHP-файл, около 20 МБ).
  # Вход: система PostgreSQL, сервер teamcity-db, пользователь teamcity, пароль admin123, база teamcity.
  # Ссылка, где уже выбраны PostgreSQL и сервер: http://localhost:8082/?pgsql=teamcity-db
  adminer:
    image: adminer:6.1.2
    container_name: adminer
    ports:
      - "8082:8080"
    mem_limit: 64m
    depends_on:
      - teamcity-db
    restart: "no"

# Именованные тома (внутри Docker Desktop). Удаляются только явно: docker compose down -v.
volumes:
  teamcity-db-data:
  beszel-data:
  teamcity-data:
  teamcity-agent-1-conf:
  teamcity-agent-1-work:
  teamcity-agent-1-home:
  teamcity-agent-2-conf:
  teamcity-agent-2-work:
  teamcity-agent-2-home:
  teamcity-agent-3-conf:
  teamcity-agent-3-work:
  teamcity-agent-3-home:
